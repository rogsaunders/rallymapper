<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 144">
  <!-- Fuel pump body -->
  <rect x="28" y="44" width="56" height="80" rx="6" fill="none" stroke="#000" stroke-width="8"/>
  <!-- Pump screen/display -->
  <rect x="38" y="56" width="36" height="24" rx="3" fill="#000"/>
  <!-- Nozzle arm -->
  <line x1="84" y1="60" x2="110" y2="60" stroke="#000" stroke-width="8" stroke-linecap="round"/>
  <line x1="110" y1="60" x2="110" y2="84" stroke="#000" stroke-width="8" stroke-linecap="round"/>
  <!-- Nozzle -->
