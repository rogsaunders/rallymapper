<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unsubscribed — RouteMapper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  body { margin: 0; padding: 0; background: #EDE6DB; font-family: 'Inter', Arial, sans-serif; }
  a { color: #C1481C; }
  a:hover { color: #93340F; }
</style>
</head>
<body>

<div style="min-height:100vh; background:#EDE6DB; display:flex; align-items:center; justify-content:center; padding:24px;">
  <div style="width:440px; max-width:100%; background:#FBF7F1; border-radius:8px; box-shadow:0 1px 3px rgba(30,20,10,0.08); overflow:hidden; text-align:center;">

    <div style="background:#241A15; padding:28px 24px;">
      <img src="/assets/routemapper-logo.png" width="96" alt="RouteMapper" style="display:block; margin:0 auto; width:96px; height:auto;" />
    </div>

    <div style="height:5px; background:linear-gradient(90deg,#F7941E 0%,#E8590C 55%,#B5280A 100%);"></div>

    <div style="padding:36px 32px 40px;">
      <div style="font-family:'Oswald',Arial,sans-serif; font-size:20px; font-weight:600; color:#2A211C; margin-bottom:10px;">
        You're unsubscribed
      </div>
      <p style="margin:0 0 24px; font-size:15px; line-height:1.6; color:#4A3F36;">
        You won't receive any more RouteMapper newsletter emails. If that was a mistake, just let us know and we'll add you back.
      </p>
      <a href="https://app.routemapper.net" style="display:inline-block; font-size:14px; font-weight:500; color:#B5280A; text-decoration:none; border:1px solid #E7DCCB; border-radius:4px; padding:10px 20px;">
        Back to RouteMapper
      </a>
    </div>

  </div>
</div>

</body>
</html>
